# 校园墙项目：校园墙项目文件：application.yml。
spring:
  servlet:
    multipart:
      # 上传上限：Spring 默认单文件只让传 1MB，一张 2.5MB 的截图根本到不了上传接口自己的 5MB 校验就被拦了。
      # 这里改成和上传接口一致的单文件 5MB，单次请求总共 10MB，重启后端后生效。
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    # allowPublicKeyRetrieval=true 是必须的：MySQL 8 默认用 caching_sha2_password，容器重启后密码缓存清空，
    # 第一次登录就要取公钥，不加这一项就会报 Public Key Retrieval is not allowed，后端起不来。只用于本地开发。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_wall?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-before-deploy}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:uploads}
  # 频率限制：每人每小时最多发 10 条帖子、30 条评论，同一网络地址哈希每小时最多发 50 条帖子。
  limits:
    posts-per-hour: 10
    comments-per-hour: 30
    posts-per-hour-per-ip: 50
