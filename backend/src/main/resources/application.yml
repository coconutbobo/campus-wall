# 校园墙项目：校园墙项目文件：application.yml。
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_wall?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-before-deploy}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:uploads}
  # 频率限制：每人每小时最多发 10 条帖子、30 条评论，同一网络地址哈希每小时最多发 50 条帖子。
  limits:
    posts-per-hour: 10
    comments-per-hour: 30
    posts-per-hour-per-ip: 50
